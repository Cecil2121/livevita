# Builds LiveVita.vpk on GitHub. Runs on every push and by hand (Actions tab > Build VPK > Run workflow).
# The finished VPK is attached to the run as "LiveVita-vpk" (a zip containing LiveVita.vpk).
#
# Optional: Settings > Secrets and variables > Actions > Variables > New repository variable
#   Name: TWITCH_CLIENT_ID   Value: your app's Client ID from dev.twitch.tv/console
# With it, every build has your Client ID built in. Without it, put the ID in
# ux0:data/LiveVita/client_id.txt on the Vita instead.
name: Build VPK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - name: Tools
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash make cmake git
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bash make cmake git ca-certificates
          fi

      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        env:
          LV_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
        run: |
          export VITASDK=${VITASDK:-/usr/local/vitasdk}
          cmake -S . -B build -DLV_CLIENT_ID="${LV_CLIENT_ID}"
          cmake --build build -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: LiveVita-vpk
          path: build/LiveVita.vpk
